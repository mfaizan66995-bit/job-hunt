services:
  - type: web
    name: job-hunt-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://job-hunt-app.vercel.app
      - key: RESUME_UPLOAD_PATH
        value: ./uploads/resumes
      - key: MAX_UPLOAD_SIZE
        value: 5242880
      - key: APP_NAME
        value: Job Hunt Agent
