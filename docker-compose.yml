version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: job-hunt-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - job-hunt-network

  backend:
    build: ./backend
    container_name: job-hunt-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/job-hunt?authSource=admin
      JWT_SECRET: your_jwt_secret_key
      FRONTEND_URL: http://localhost:5173
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - job-hunt-network
    command: npm run dev

  frontend:
    build: ./frontend
    container_name: job-hunt-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - job-hunt-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  job-hunt-network:
    driver: bridge
